name: Deploy static website to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site files
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Clear stuck GitHub Pages deployment
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.request('POST /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}/cancel', {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pages_deployment_id: 'd77324fb46dd19a476f0de738db2b716a00331f7'
              });
              core.info('Cancelled the stuck Pages deployment.');
            } catch (error) {
              if (error.status === 404) {
                core.info('The old Pages deployment is already cleared.');
              } else {
                throw error;
              }
            }

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
